[workspace]
resolver = "2"
members = [
    "crates/ma-harness-cordis",
    "crates/ma-harness-core",
    "crates/ma-harness-seam",
    "crates/ma-harness-proto",  # 2026-08-18 (Day 52): 恢复, 用本地 vendor/protoc
    "crates/ma-harness-cli",
    "crates/ma-harness-server",
    "crates/ma-harness-plugin-macro",
    "crates/ma-harness-demo",
    "crates/ma-harness-conformance",
    "crates/ma-harness-sandbox",  # 2026-08-18 (Day 55): Phase 2.2 landlock sandbox
    "crates/ma-harness-model",  # 2026-08-18 (Day 57): Phase 2.3 OpenAI / Anthropic adapter
    "crates/ma-harness-code",  # 2026-08-19 (Day 68): Phase 2.6 Code Mode (wasmtime)
    "crates/ma-harness-tui",  # 2026-08-19 (Day 80): Phase 3.9 TUI dashboard (ratatui)
    "crates/ma-harness-registry",  # 2026-08-20 (Day 101+1): P11-6 Plugin Registry
    "crates/ma-harness-bundle",  # 2026-08-20 (Day 101+1): P11-8 Bundle 概念
    "crates/ma-harness-artifact",  # 2026-08-20 (Day 101+1): P11-7 Vibe Coding artifact viewer
    "crates/ma-harness-dag",  # 2026-08-20 (Day 101+1): P12-9 DAG 任务编排
    "crates/ma-harness-subprocess",  # 2026-09-04 (Day 101+32): P14.1 ctx.subprocess 能力缝
    "crates/ma-harness-shell",  # 2026-09-04 (Day 101+32): P14.2.1 ctx.shell 能力缝 (Service Def)
    "crates/ma-harness-skill",  # 2026-09-04 (Day 101+32): P14.3.1 ctx.skill 能力缝 (Service Def)
    "crates/ma-harness-compaction",  # 2026-09-04 (Day 101+32): P14.4.1 context compaction
    "crates/ma-harness-lsp",  # 2026-09-04 (Day 101+32): P14.5.1 ctx.lsp 能力缝 (JSON-RPC client)
    "crates/ma-harness-web",  # 2026-09-04 (Day 101+32): P14.6.1 ctx.web 能力缝 (HTTP fetch + search stub)
    "crates/ma-harness-todo",  # 2026-09-04 (Day 101+32): P14.7.1 ctx.todo + ctx.plan 能力缝
    "crates/ma-harness-session",  # 2026-09-04 (Day 101+32): P14.8.1 ctx.sessions fork + ctx.goals + ctx.sessionTitle
    "crates/ma-harness-profile",  # 2026-09-04 (Day 101+32): P14.9.1 profile system (5 default profiles)
    "crates/ma-harness-context",  # 2026-09-04 (Day 101+32): P14.10.1 request-context plugin (RequestContext + Middleware)
    "crates/ma-harness-guard",  # 2026-09-04 (Day 101+32): P14.11.1 loop-hygiene (MaxSteps + RepeatedArgs)
    "crates/ma-harness-web-ui",  # 2026-09-04 (Day 101+32): P15.1.1 Web UI 骨架 (HTML shell + SSE endpoint)
    "crates/ma-harness-terminal",  # 2026-09-05 (Day 101+33): P15.2.1 ctx.terminals 能力缝 (portable-pty)
    "plugins/ma-harness-plugin-hello",
    "plugins/ma-harness-plugin-bash",
    "plugins/ma-harness-plugin-fs",
    "plugins/ma-harness-plugin-web",
    "plugins/ma-harness-plugin-subagent",
    "plugins/ma-harness-plugin-skill",
    "plugins/ma-harness-plugin-cordis",
    "plugins/ma-harness-plugin-dsh-adapter",  # 2026-08-21 (Day 101+2): P13 dsh-adapter 骨架
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ma-harness/ma-harness.rs"
authors = ["ma-harness contributors"]
description = "ma-harness.rs: Rust framework for AI agent orchestration, LLM adapters (OpenAI/Anthropic/Deepseek/Stub), plugin registry, and CLI. See README for details. Mirror: https://gitee.com/yifenma/ma-harness.rs"
homepage = "https://github.com/ma-harness/ma-harness.rs"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# 一些我们暂时不能修的, 留给 Phase 2 收
# module_name_repetitions = "allow"
# similar_names = "allow"

# 集中管理依赖版本, 子 crate 用 workspace = true 引用
[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
# P5-6 / Day 95: ModelAdapter::complete_stream 返 async stream
async-stream = "0.3"

# Protobuf / gRPC
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
tonic-reflection = "0.12"
# 2026-08-19 (Day 101 / P7-1.2): tonic-web 暴露 gRPC 给浏览器 (gRPC-web 桥)
# 跟 Web UI (port 3080) 配 tonic :50050, 业务方 fetch /api 走 gRPC-web
tonic-web = "0.12"

# HTTP (server only) — 2026-08-18 axum → salvo (宪法规格变更, 见 decision-log §12)
# salvo 自带 hyper 1, 编译比 axum 快, 内置 OpenAPI 导出 (#[endpoint] macro)
# 2026-08-19 (Day 101): salvo 0.79 → 0.95 升级 (P6-7), 跳 16 minor, 0 break
salvo = { version = "0.95", features = ["test", "oapi", "sse"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"

# 错误
thiserror = "1"
anyhow = "1"

# 可观测
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 存储
rusqlite = { version = "0.32", features = ["bundled"] }

# Sandbox
landlock = "0.4"
nix = { version = "0.29", default-features = false, features = ["fs", "process"] }

# CLI
clap = { version = "4", features = ["derive", "wrap_help"] }
indicatif = "0.17"
console = "0.15"

# 测试
proptest = "1"
mockall = "0.13"
insta = { version = "1", features = ["yaml", "redactions"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
trybuild = "1"
tokio-test = "0.4"
pretty_assertions = "1"
wiremock = "0.6"

# 并发
dashmap = "6"
parking_lot = "0.12"
arc-swap = "1.7"

# 分布式插件注册 (Phase 2.2 / T2.2 — 按名查 plugin)
inventory = "0.3"

# 时间 / ID
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# 测试临时文件
tempfile = "3"

# 编码 (P11-5: vision model 图像 base64)
base64 = "0.22"

# 版本 (P11-6: Plugin Registry 用 semver)
semver = { version = "1", features = ["serde"] }

# Bundle (P11-8)
toml = "0.8"

# P15.2 PTY backend (portable-pty: ConPTY on Windows 10+, openpty on POSIX)
# 业务方 2026-09-04 起, 2026-09-05 P15.2.1 引入
portable-pty = "0.8"

# proc-macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Code Mode (Phase 2 / T3.1 — LLM-generated code 跑在 wasm sandbox)
wasmtime = { version = "27" }
wat = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
