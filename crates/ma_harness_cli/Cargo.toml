[package]
name = "ma_harness_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "ma-harness CLI (二进制, 提供 `mah` 命令)"

[lints]
workspace = true

[[bin]]
name = "mah"
path = "src/main.rs"

[dependencies]
# 内部
ma_harness_cordis = { path = "../ma_harness_cordis" }
ma_harness_core = { path = "../ma_harness_core" }
ma_harness_seam = { path = "../ma_harness_seam" }
ma_harness_proto = { path = "../ma_harness_proto" }
ma_harness_server = { path = "../ma_harness_server" }
ma_harness_conformance = { path = "../ma_harness_conformance" }
ma_harness_plugin_hello = { path = "../../plugins/ma_harness_plugin_hello" }
# 外部
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
