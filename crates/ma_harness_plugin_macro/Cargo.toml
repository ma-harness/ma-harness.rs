[package]
name = "ma-harness-plugin-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "ma-harness 插件 proc-macro crate (公开, API 锁: #[dsh_service/listener/tool/command/handler] + ctx_key!)"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
# 内部依赖 (dsh_service_dual / dsh_plugin_dual 展开时引用)
ma-harness-cordis = { path = "../ma_harness_cordis" }
# 注意: 不能 dep ma_harness_seam (cyclic — seam re-export DshService 来自本 crate)
# seam 引用是 user 端用 use ma_harness_seam::dsh_*_dual; 时引入, macro 展开的 ::ma_harness_seam::Service
# 由 user crate 的 path resolution 提供. trybuild 编译时由 user crate (plugin_hello) 提供.
# 外部
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# 集成测试用 (dsh_tool / dsh_command 生成的代码引用这些)
ma-harness-core = { path = "../ma_harness_core" }
# trybuild: 编译失败 fixture 测试 (Phase 2.4)
trybuild = { workspace = true }
