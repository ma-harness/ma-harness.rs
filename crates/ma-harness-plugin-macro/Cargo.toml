[package]
name = "ma-harness-plugin-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
homepage = "https://gitee.com/yifenma/ma-harness.rs"
keywords = ["plugin", "proc-macro", "service", "listener", "derive"]
categories = ["development-tools", "no-std", "api-bindings"]
description = "ma-harness plugin proc-macro crate: #[dsh_service/listener/tool/command/handler] derives + ctx_key! macro + dsh_service_dual / dsh_plugin_dual attribute macros"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
# 内部依赖 (dsh_service_dual / dsh_plugin_dual 展开时引用)
# version="0.1.0" 跟 cordis 当前 version 对齐
ma-harness-cordis = { path = "../ma-harness-cordis", version = "0.1.0" }
# 注意: 不能 dep ma_harness_seam (cyclic — seam re-export DshService 来自本 crate)
# seam 引用是 user 端用 use ma_harness_seam::dsh_*_dual; 时引入, macro 展开的 ::ma_harness_seam::Service
# 由 user crate 的 path resolution 提供. trybuild 编译时由 user crate (plugin_hello) 提供.
# 外部
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# 集成测试用 (dsh_tool / dsh_command 生成的代码引用这些)
ma-harness-core = { path = "../ma-harness-core" }
# 2026-08-19 (Day 101 / P7-0.4): 修 pre-existing broken test
# ctx_key! macro 在 seam (proc-macro crate 不允许 export macro_rules!)
ma-harness-seam = { path = "../ma-harness-seam" }
# trybuild 编译 fixtures 用 (e.g. dsh_listener async fn 展开需要 tokio)
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# trybuild: 编译失败 fixture 测试 (Phase 2.4)
trybuild = { workspace = true }
