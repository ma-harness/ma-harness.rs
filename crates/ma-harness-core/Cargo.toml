[package]
name = "ma-harness-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
homepage = "https://gitee.com/yifenma/ma-harness.rs"
keywords = ["agent", "session", "event-log", "agent-loop", "model-adapter"]
categories = ["development-tools", "api-bindings", "asynchronous"]
description = "ma-harness core: SessionEvent / agent loop / EventLog (sqlite) / ModelAdapter trait"

[lints]
workspace = true

[dependencies]
# 内部依赖 (version="0.1.0" 跟 cordis 当前 version 对齐, publish 时 crates.io 找得到)
ma-harness-cordis = { path = "../ma-harness-cordis", version = "0.1.0" }
# 外部
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
criterion = { workspace = true }

[[bench]]
name = "agent"
harness = false
