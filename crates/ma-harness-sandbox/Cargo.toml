[package]
name = "ma-harness-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "ma-harness OS-level sandbox (landlock on Linux, Seatbelt on macOS, Stub elsewhere)"

[lints]
workspace = true

[dependencies]
# 内部
ma-harness-cordis = { path = "../ma-harness-cordis" }

# 外部
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# landlock 0.4 只在 Linux 启用 (Windows 不编译, 走 cfg gate)
# nix 0.29 是 cfg(unix), Windows 不能用, 暂不引; Phase 2.3 macOS Seatbelt 用 sandbox-exec shell
landlock = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[features]
default = []
# `linux-landlock` feature 在 Linux 上默认启用, 其他平台 stub
linux-landlock = ["dep:landlock"]

[dev-dependencies]
serde_json = { workspace = true }
