[package]
name = "ma-harness-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
homepage = "https://github.com/ma-harness/ma-harness.rs"
keywords = ["llm", "openai", "anthropic", "deepseek", "model-adapter", "agent"]
categories = ["api-bindings", "asynchronous", "development-tools"]
description = "ma-harness LLM model adapters: OpenAI / Anthropic / Deepseek / Stub with streaming, retry, vision, tool-call. Standalone usable without the rest of ma-harness."

[lints]
workspace = true

[dependencies]
# 内部 (path 本地, version 让 publish 后 crates.io 找得到)
ma-harness-core = { path = "../ma-harness-core", version = "0.1.0" }
ma-harness-cordis = { path = "../ma-harness-cordis", version = "0.1.0" }  # P12-8: Context type

# 外部
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }  # P11-5: vision model image base64 encoding
tokio = { workspace = true }  # P12-2: retry_with_backoff async sleep

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }  # P11-5: ImageAttachment::from_path test

[[bench]]
name = "streaming"
harness = false
