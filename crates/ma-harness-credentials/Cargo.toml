[package]
name = "ma-harness-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "ma-harness user credentials (ctx.credentials): env var + .env file providers with keyring abstraction. P15.5.6 dsh parity."

[lints]
workspace = true

[dependencies]
# Internal — ctx key plumbing
ma-harness-cordis = { path = "../ma-harness-cordis", version = "0.1.0" }
ma-harness-seam = { path = "../ma-harness-seam", version = "0.1.0" }

# External
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
