[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mah-py"
version = "0.1.1"
description = "Python SDK for ma-harness.rs (Rust AI agent orchestrator)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "ma-harness.rs authors" }
]
keywords = ["ai", "agent", "llm", "ma-harness", "mah"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://gitee.com/yifenma/ma-harness.rs"
Repository = "https://gitee.com/yifenma/ma-harness.rs"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["mah_py"]

[tool.setuptools.package-data]
mah_py = ["py.typed"]
