[package]
name = "ma-harness-cordis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
homepage = "https://gitee.com/yifenma/ma-harness.rs"
keywords = ["cordis","di","plugin","context","service"]
categories = ["development-tools","no-std"]
description = "Cordis-style DI container + plugin/typed-key/disposable framework. Internal but used by all ma-harness plugins. Stable enough to publish for plugin authors who want stable API surface."

[lints]
workspace = true

[dependencies]
# Phase 1 Week 1 依赖 (跟 tech-stack 冻结)
dashmap = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
# Phase 2.4 (T2.4): dispose_all_async 走 join_all
futures = { workspace = true }
# 2026-08-19 (Day 101 / P7-2.1): ApprovalService trait 用 serde + serde_json 序列化
# ApprovalRequest (JSON args + risk level), ApprovalPolicy (whitelist)
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# 测试用
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
uuid = { workspace = true }
# benches/ 用 criterion 跑 micro-bench
criterion = { workspace = true }

[[bench]]
name = "core"
harness = false
