ma-harness-server = { path = "../ma-harness-server", version = "0.1.0" }  # 2026-08-18 (Day 52): 恢复
ma-harness-conformance = { path = "../ma-harness-conformance", version = "0.1.0" }
ma-harness-code = { path = "../ma-harness-code", version = "0.1.0" }  # 2026-08-19 (Day 68): Phase 2.6 Code Mode
ma-harness-model = { path = "../ma-harness-model", version = "0.1.0" }  # 2026-08-19 (Day 73): Phase 3.3 LLM↔Code Mode 端到端
ma-harness-sandbox = { path = "../ma-harness-sandbox", version = "0.1.0" }  # 2026-08-19 (Day 78): Phase 3.7 landlock 集成
ma-harness-tui = { path = "../ma-harness-tui", version = "0.1.0" }  # 2026-08-19 (Day 80): Phase 3.9 TUI dashboard
