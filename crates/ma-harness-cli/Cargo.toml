[package]
name = "ma-harness-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "ma-harness CLI (二进制, 提供 `mah` 命令)"

[lints]
workspace = true

[[bin]]
name = "mah"
path = "src/main.rs"

[dependencies]
# 内部
ma-harness-cordis = { path = "../ma-harness-cordis", version = "0.1.0" }
ma-harness-core = { path = "../ma-harness-core", version = "0.1.0" }
ma-harness-seam = { path = "../ma-harness-seam", version = "0.1.0" }
