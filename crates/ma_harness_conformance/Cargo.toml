chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
async-stream = "0.3"

[dev-dependencies]
# 测试用 first-party plugin (验证 framework 自身)
ma-harness-plugin-hello = { path = "../../plugins/ma_harness_plugin_hello" }
ma-harness-plugin-bash = { path = "../../plugins/ma_harness_plugin_bash" }
