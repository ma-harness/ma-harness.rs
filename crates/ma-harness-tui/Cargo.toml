[package]
name = "ma-harness-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "ma-harness TUI dashboard (ratatui) — real-time session / event / plugin view"

[lints]
workspace = true

[dependencies]
# 内部
ma-harness-cordis = { path = "../ma-harness-cordis" }
ma-harness-core = { path = "../ma-harness-core" }
ma-harness-seam = { path = "../ma-harness-seam" }
ma-harness-server = { path = "../ma-harness-server" }  # P4-3: SessionStore trait
# P4-3: 拿 proto SessionState enum 转 state name
ma-harness-proto = { path = "../ma-harness-proto" }
# Phase 3.9: inventory 走 hello plugin 验证
ma-harness-plugin-hello = { path = "../../plugins/ma-harness-plugin-hello" }
# 外部
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# P4-1: EventLog test
tempfile = { workspace = true }
# P4-3: SessionStore test (用 prost_types::Timestamp)
prost-types = { workspace = true }
