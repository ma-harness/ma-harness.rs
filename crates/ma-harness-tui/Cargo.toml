[package]
name = "ma-harness-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "ma-harness TUI dashboard (ratatui) — real-time session / event / plugin view"

[lints]
workspace = true

[dependencies]
# 内部
ma-harness-cordis = { path = "../ma-harness-cordis", version = "0.1.0" }
ma-harness-core = { path = "../ma-harness-core", version = "0.1.0" }
ma-harness-seam = { path = "../ma-harness-seam", version = "0.1.0" }
ma-harness-server = { path = "../ma-harness-server", version = "0.1.0" }  # P4-3: SessionStore trait
# P4-3: 拿 proto SessionState enum 转 state name
ma-harness-proto = { path = "../ma-harness-proto", version = "0.1.0" }
# Phase 3.9: inventory 走 hello plugin 验证
ma-harness-plugin-hello = { path = "../../plugins/ma-harness-plugin-hello", version = "0.1.1" }
# 外部
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
# P6-5 B: 选中状态持久化 (last_session_id + last_focus) → ~/.ma-harness/tui-state.json
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# 2026-08-19 (Day 101 / P7-2.4): TUI approval service (AlwaysApprove / AskApprove / TuiApprover)
async-trait = { workspace = true }

[dev-dependencies]
# P4-1: EventLog test
tempfile = { workspace = true }
# P4-3: SessionStore test (用 prost_types::Timestamp)
prost-types = { workspace = true }
