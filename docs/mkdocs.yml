# P12-3 v2 静态站配置 (mkdocs)
#
# 业务方跑 `pip install mkdocs mkdocs-material[i18n]` 后:
#   cd docs && mkdocs serve     # 本地预览 (http://localhost:8000)
#   cd docs && mkdocs gh-deploy # 部署到 GitHub Pages
#
# 业务方禁用: `mkdocs build --strict` 会 fail, 业务方先 `mkdocs build` 看 warnings.
#
# i18n 结构 (P13+, Day 101+1):
#   英文 (默认):   docs/en/<name>.md
#   简体中文:     docs/zh-CN/<name>.md
#   OpenAPI:      docs/en/api/openapi.json
#                 docs/zh-CN/api/openapi.json
#   业务方切语言: mkdocs-material 内置 language selector (header 右上角)
#   目录对称: docs/en/, docs/zh-CN/, 未来 docs/de/, docs/ja/

site_name: ma-harness.rs
site_description: "Rust 重写的 AI agent orchestrator (跟 dsh 对齐)"
site_author: "ma-harness contributors"

# 主仓库: GitHub; 国内 mirror: Gitee
repo_url: "https://github.com/ma-harness/ma-harness.rs"
repo_name: "ma-harness/ma-harness.rs"

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.code.annotate

  # mkdocs-material 自动从 docs/<lang>/ 切语言
  alternate_language: zh-CN

docs_dir: "."

nav:
  - 首页: en/README.md
  - 业务方 (User):
      - Python SDK: ../crates/mah-py/README.md
      - ACP 互通 (CLI): ../crates/ma-harness-cli/src/acp.rs
      - Plugin Registry: ../crates/ma-harness-registry/README.md
      - Bundle 概念: ../crates/ma-harness-bundle/README.md
      - Artifact Viewer: ../crates/ma-harness-artifact/README.md
  - 架构 (Architecture):
      - 架构总览: en/ma-harness-arch-map.md
      - 技术栈: en/tech-stack.md
      - Macro 设计: en/macro-design.md
      - Plugin Schema: en/plugin-schema-v1.md
  - 国际化 (i18n):
      - 双语规范: en/i18n.md
  - Conformance (跑分):
      - Conformance 设计: en/conformance-design.md
      - P11-2 dsh 真实 snapshot 跑分: zh-CN/reports/dsh-benchmark-report.md
      - P11 baseline 报告: zh-CN/reports/p11-baseline-report.md
      - P11 全收官报告: zh-CN/reports/p11-final-report.md
      - P12 全收官报告: zh-CN/reports/p12-final-report.md
      - week 11 conformance 报告: zh-CN/reports/conformance-report-week11.md
      - week 11 benchmark 报告: zh-CN/reports/benchmark-report-week11.md
      - Benchmark 设计: en/benchmark-design.md
  - Roadmap (路线):
      - Phase 7-10: zh-CN/reports/roadmap-phase-7.md
      - Phase 11: zh-CN/reports/roadmap-phase-11.md
  - 实验 (Experiments):
      - PyO3 评估: zh-CN/reports/pyo3-evaluation.md
      - Code Mode 延后: zh-CN/reports/code-mode-deferred.md
  - 决策 (Decisions):
      - 决策日志: zh-CN/decision-log.md
  - 周报 (Weekly):
      - Day 0: zh-CN/weekly/000-day0.md
      - Week 1-2: zh-CN/weekly/001-w01-w02.md
      - Week 3-4: zh-CN/weekly/002-w03-w04.md
      - Week 5-6: zh-CN/weekly/003-w05-w06.md
      - Week 7-9: zh-CN/weekly/004-w07-w09.md
      - Week 10: zh-CN/weekly/005-w10-conformance.md
      - Week 11: zh-CN/weekly/006-w11-frameworks.md
      - Week 12: zh-CN/weekly/007-w12-final.md
  - API Reference:
      - OpenAPI (English): en/api/openapi.json
      - OpenAPI (简体中文): zh-CN/api/openapi.json

# mkdocs-material i18n 备用语言 (header 右上角切换)
extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 简体中文
      link: /zh-CN/
      lang: zh-CN

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
