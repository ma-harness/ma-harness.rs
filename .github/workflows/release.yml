name: Release

# Phase 3.8 / T3.8: 自动 publish 到 crates.io
# 用 crates.io Trusted Publishing (OIDC) — 无需 CARGO_REGISTRY_TOKEN secret
# https://crates.io/docs/trusted-publishing

on:
  push:
    tags:
      - 'v*'  # v0.1.0, v0.1.1, v0.2.0, etc.
  workflow_dispatch:  # 业务方手动触发 (调试用)

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Pre-publish: 完整 workspace 测试 + 验证
  # ============================================================================
  test:
    name: Pre-publish test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run all tests
        run: cargo test --workspace --lib

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ============================================================================
  # Dry-run: 验证 metadata OK 不真发
  # ============================================================================
  dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 只 dry-run 公开的 5 个 crate
      - name: cargo publish --dry-run (ma-harness-cordis)
        run: cargo publish -p ma-harness-cordis --dry-run --allow-dirty

      - name: cargo publish --dry-run (ma-harness-code)
        run: cargo publish -p ma-harness-code --dry-run --allow-dirty

      - name: cargo publish --dry-run (ma-harness-core)
        run: cargo publish -p ma-harness-core --dry-run --allow-dirty

      - name: cargo publish --dry-run (ma-harness-plugin-macro)
        run: cargo publish -p ma-harness-plugin-macro --dry-run --allow-dirty

      - name: cargo publish --dry-run (ma-harness-seam)
        run: cargo publish -p ma-harness-seam --dry-run --allow-dirty

  # ============================================================================
  # Publish: 真发 (需要 crates.io Trusted Publishing 在 ma-harness repo enable)
  # ============================================================================
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [dry-run]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # crates.io Trusted Publishing (OIDC)
      # 在 https://crates.io/crates/ma-harness-cordis/settings 配 GitHub repo
      - name: Publish ma-harness-cordis
        run: cargo publish -p ma-harness-cordis --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index update
        run: sleep 30

      - name: Publish ma-harness-code
        run: cargo publish -p ma-harness-code --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index update
        run: sleep 30

      # P4-2 (Day 84): 加 3 个新公开 crate, 顺序 core + plugin-macro (并行) → seam
      - name: Publish ma-harness-core
        run: cargo publish -p ma-harness-core --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ma-harness-plugin-macro
        run: cargo publish -p ma-harness-plugin-macro --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index update
        run: sleep 30

      # seam 依赖 core + macro + cordis, 必须最后发
      - name: Publish ma-harness-seam
        run: cargo publish -p ma-harness-seam --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ============================================================================
  # GitHub release: 同步发 GitHub Release notes
  # ============================================================================
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
