name: Release

# Layer 3 CI/CD: 自动 publish 到 crates.io
# 触发: git push tag v*.*.*  (v0.1.0 / v0.1.1 / v0.2.0 ...)
# 流程: test → dry-run → publish (按依赖顺序) → GitHub release notes
#
# Secret: 在 GitHub repo → Settings → Secrets → actions 加 CARGO_REGISTRY_TOKEN
# Token:  https://crates.io/settings/tokens  (scope: publish)
#
# 2026-08-20 (Day 101+1) / P15+ docs: 24 个 crate 全发布
#   - 16 个 crates/ 内部框架 (demo 跳过, 它是 example binary)
#   - 8 个 plugins/ first-party plugin (hello/bash/cordis/fs/skill/subagent/web/dsh-adapter)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 业务方手动触发 (调试用)

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Pre-publish: 完整 workspace 测试
  # ============================================================================
  test:
    name: Pre-publish test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # 2026-08-21 (Day 101+2): ma-harness-proto build.rs 跑 protoc, ci 不装就 panic
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run all tests
        run: cargo test --workspace --lib
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ============================================================================
  # Dry-run: 验证 metadata OK
  # ============================================================================
  dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # 24 个全 dry-run, 验证 metadata + 依赖 + path resolution
      - name: dry-run (cordis)
        run: cargo publish -p ma-harness-cordis --dry-run --allow-dirty --no-verify
      - name: dry-run (code)
        run: cargo publish -p ma-harness-code --dry-run --allow-dirty --no-verify
      - name: dry-run (dag)
        run: cargo publish -p ma-harness-dag --dry-run --allow-dirty --no-verify
      - name: dry-run (artifact)
        run: cargo publish -p ma-harness-artifact --dry-run --allow-dirty --no-verify
      - name: dry-run (core)
        run: cargo publish -p ma-harness-core --dry-run --allow-dirty --no-verify
      - name: dry-run (sandbox)
        run: cargo publish -p ma-harness-sandbox --dry-run --allow-dirty --no-verify
      - name: dry-run (proto)
        run: cargo publish -p ma-harness-proto --dry-run --allow-dirty --no-verify
      - name: dry-run (registry)
        run: cargo publish -p ma-harness-registry --dry-run --allow-dirty --no-verify
      - name: dry-run (model)
        run: cargo publish -p ma-harness-model --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-macro)
        run: cargo publish -p ma-harness-plugin-macro --dry-run --allow-dirty --no-verify
      - name: dry-run (seam)
        run: cargo publish -p ma-harness-seam --dry-run --allow-dirty --no-verify
      - name: dry-run (bundle)
        run: cargo publish -p ma-harness-bundle --dry-run --allow-dirty --no-verify
      - name: dry-run (conformance)
        run: cargo publish -p ma-harness-conformance --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-hello)
        run: cargo publish -p ma-harness-plugin-hello --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-bash)
        run: cargo publish -p ma-harness-plugin-bash --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-cordis)
        run: cargo publish -p ma-harness-plugin-cordis --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-fs)
        run: cargo publish -p ma-harness-plugin-fs --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-skill)
        run: cargo publish -p ma-harness-plugin-skill --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-subagent)
        run: cargo publish -p ma-harness-plugin-subagent --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-web)
        run: cargo publish -p ma-harness-plugin-web --dry-run --allow-dirty --no-verify
      - name: dry-run (plugin-dsh-adapter)
        # P13.5: 走 dsh JSON-RPC over stdio, 业务方装 dsh 后直接加载 TS plugin
        run: cargo publish -p ma-harness-plugin-dsh-adapter --dry-run --allow-dirty --no-verify
      - name: dry-run (server)
        run: cargo publish -p ma-harness-server --dry-run --allow-dirty --no-verify
      - name: dry-run (tui)
        run: cargo publish -p ma-harness-tui --dry-run --allow-dirty --no-verify
      - name: dry-run (cli)
        run: cargo publish -p ma-harness-cli --dry-run --allow-dirty --no-verify

  # ============================================================================
  # Publish: 按依赖顺序发 (24 个 crate, 全 workspace 除 demo)
  # ============================================================================
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [dry-run]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # 2026-08-21 (Day 101+2): cargo publish 跑 build script, ma-harness-proto 要 protoc
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # --- Tier 0: 叶子 (无内部 ma-harness 依赖) ---
      - name: Publish ma-harness-cordis
        run: cargo publish -p ma-harness-cordis --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-code
        run: cargo publish -p ma-harness-code --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-dag
        run: cargo publish -p ma-harness-dag --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-artifact
        run: cargo publish -p ma-harness-artifact --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30

      # --- Tier 1: 依赖 cordis/code ---
      - name: Publish ma-harness-core
        run: cargo publish -p ma-harness-core --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-sandbox
        run: cargo publish -p ma-harness-sandbox --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30

      # --- Tier 2: 依赖 core ---
      - name: Publish ma-harness-proto
        run: cargo publish -p ma-harness-proto --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-registry
        run: cargo publish -p ma-harness-registry --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-model
        run: cargo publish -p ma-harness-model --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-plugin-macro
        run: cargo publish -p ma-harness-plugin-macro --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30

      # --- Tier 3: 依赖 Tier 0+1+2 ---
      - name: Publish ma-harness-seam
        run: cargo publish -p ma-harness-seam --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-bundle
        run: cargo publish -p ma-harness-bundle --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-conformance
        run: cargo publish -p ma-harness-conformance --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30

      # --- Tier 3.5: 7 个 first-party plugin (都依赖 cordis/core/plugin-macro/seam) ---
      - name: Publish ma-harness-plugin-hello
        run: cargo publish -p ma-harness-plugin-hello --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-plugin-bash
        run: cargo publish -p ma-harness-plugin-bash --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-plugin-cordis
        run: cargo publish -p ma-harness-plugin-cordis --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-plugin-fs
        run: cargo publish -p ma-harness-plugin-fs --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-plugin-skill
        run: cargo publish -p ma-harness-plugin-skill --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-plugin-subagent
        run: cargo publish -p ma-harness-plugin-subagent --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-plugin-web
        run: cargo publish -p ma-harness-plugin-web --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-plugin-dsh-adapter
        # P13.5: 8th first-party plugin, 跟 plugin-web 同 tier
        run: cargo publish -p ma-harness-plugin-dsh-adapter --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30

      # --- Tier 4: 端到端服务 (依赖 Tier 0-3) ---
      - name: Publish ma-harness-server
        run: cargo publish -p ma-harness-server --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30

      # --- Tier 5: 顶层 binary (依赖 Tier 0-4) ---
      - name: Publish ma-harness-tui
        run: cargo publish -p ma-harness-tui --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index
        run: sleep 30
      - name: Publish ma-harness-cli
        run: cargo publish -p ma-harness-cli --token ${CRATES_IO_TOKEN}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ============================================================================
  # GitHub release notes
  # ============================================================================
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
