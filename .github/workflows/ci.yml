name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 避免同 PR 重复跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 注: ma-harness code 用 wasmtime + nix 等有 noise warnings,
  # 在 workspace 级别 -D warnings 太严格. clippy 用 deny(warnings) 但允许 crate-level allow.
  RUSTFLAGS: ""

jobs:
  # ============================================================================
  # Lint (fmt + clippy) — 最快, 先跑
  # ============================================================================
  # 2026-08-21 (Day 101+2): 临时 disable, 业务方要求"只跑 Test (ubuntu+landlock)"验证
  # 之前 OpenAPI baseline 问题。全 lint+build 过, 重启时改回 if: ${{ ... }}
  lint:
    name: Lint (fmt + clippy) [DISABLED, 只跑 Test]
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 2026-08-21 (Day 101+1): clippy 跑 build.rs 触发 protoc, lint job 也要装
      # (跟 build job 同样的逻辑, vendor/ 在 .gitignore, 只能用系统 protoc)
      - name: Install protoc (Linux, lint)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ============================================================================
  # Build (cross-platform sanity check) — Linux + Windows + macOS
  # ============================================================================
  # 2026-08-21 (Day 101+2): 临时 disable, 业务方要求"只跑 Test (ubuntu+landlock)"验证
  # 之前 OpenAPI baseline 问题。
  build:
    name: Build (${{ matrix.os }}) [DISABLED, 只跑 Test]
    runs-on: ${{ matrix.os }}
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 跨平台装 protoc (Windows 用 choco, Linux 用 apt, macOS 用 brew)
      # build.rs 直接用系统 PATH 里的 protoc, 不依赖 vendor (vendor/ 在 .gitignore)
      - name: Install protoc (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y protoc

      - name: Install protoc (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf

      - name: Build (debug)
        run: cargo build --workspace --all-targets

  # ============================================================================
  # Test (Ubuntu + landlock 真测)
  # ============================================================================
  # 2026-08-21 (Day 101+2): 临时 enable 跑这一个, 验 OpenAPI baseline 修复
  # 跟之前修过的 sandbox + creator.rs 等。needs: [] 解除对 lint+build 的依赖,
  # 因为 lint + build 临时 disable 了。
  test:
    name: Test (ubuntu + landlock) [ONLY JOB RUNNING]
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build deps
        # landlock ABI V1 needs kernel >= 5.13
        run: |
          uname -r
          cat /etc/os-release

      - name: Install protoc
        # 2026-08-21 (Day 101+2): ma-harness-proto build.rs 跑 protoc, Test job 也要装
        # 之前 88d4dd2 只给 lint job 装了, Test/Build 漏装导致 build.rs panic
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Test (workspace lib)
        run: cargo test --workspace --lib

      - name: Test (workspace all targets)
        run: cargo test --workspace --all-targets

      - name: Test ma-harness-sandbox (real landlock)
        # Linux only: ma-harness-sandbox 走 landlock 0.4, Windows 走 stub
        run: cargo test -p ma-harness-sandbox --lib -- --nocapture

      - name: Build mah CLI
        run: cargo build -p ma-harness-cli

      - name: "Smoke test: mah version"
        run: ./target/debug/mah version

      - name: "Smoke test: mah plugins (inventory)"
        run: ./target/debug/mah plugins

      - name: "Smoke test: mah code run (wasm sandbox)"
        # 跑 T3.1 demo wat, 验 fuel + memory limiter 不误杀简单代码
        run: ./target/debug/mah code run examples/hello.wat

      - name: "Smoke test: mah load-plugin hello"
        run: ./target/debug/mah load-plugin hello

      - name: OpenAPI drift check
        # Phase 3.5 / T3.5: 生成 spec 跟 docs/api/openapi.json diff, 不一致 fail
        run: |
          set -e
          ./target/debug/mah open-api export --output /tmp/openapi.new.json
          if ! diff -q /tmp/openapi.new.json docs/api/openapi.json > /dev/null 2>&1; then
            echo "::error::OpenAPI spec drift detected!"
            echo "Run 'mah open-api export --output docs/api/openapi.json' locally and commit."
            diff /tmp/openapi.new.json docs/api/openapi.json || true
            exit 1
          fi
          echo "OpenAPI spec up to date"

  # ============================================================================
  # Test (Windows) — 验 Windows 也能 build + test
  # ============================================================================
  # 2026-08-21 (Day 101+2): 临时 disable, 业务方要求"只跑 Test (ubuntu+landlock)"
  test-windows:
    name: Test (windows) [DISABLED, 只跑 Test]
    runs-on: windows-latest
    needs: []
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        # 2026-08-21 (Day 101+2): ma-harness-proto build.rs 跑 protoc
        run: choco install -y protoc

      - name: Test (workspace lib)
        run: cargo test --workspace --lib

      - name: Test ma-harness-sandbox (Windows stub)
        # Windows 没 landlock, 跑 stub 分支
        run: cargo test -p ma-harness-sandbox --lib

      - name: Build mah CLI
        run: cargo build -p ma-harness-cli

      - name: "Smoke test: mah code run (wasm sandbox on Windows)"
        run: .\target\debug\mah.exe code run examples/hello.wat

  # ============================================================================
  # Conformance report (Nightly only, 防止 daily 跑太慢)
  # ============================================================================
  conformance:
    name: Conformance (nightly) [DISABLED, 等 Test 恢复后开启]
    runs-on: ubuntu-latest
    if: false
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        # 2026-08-21 (Day 101+2): ma-harness-proto build.rs 跑 protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run conformance (synthetic fixtures)
        run: |
          cargo run -p ma-harness-cli -- conformance \
            --fixtures crates/ma-harness-conformance/fixtures/smoke.jsonl \
            --output target/

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            target/conformance-report.md
            target/conformance-report.json
          retention-days: 30
