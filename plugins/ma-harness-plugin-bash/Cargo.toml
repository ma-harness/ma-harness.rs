[package]
name = "ma-harness-plugin-bash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "ma-harness first-party plugin 'bash' (执行 shell 命令, Week 5-6 实装)"

[lints]
workspace = true

[dependencies]
# 公开 API (seam) + 内部 (cordis 写 typed key)
ma-harness-seam = { path = "../../crates/ma-harness-seam", version = "0.1.0" }
ma-harness-cordis = { path = "../../crates/ma-harness-cordis", version = "0.1.0" }
ma-harness-plugin-macro = { path = "../../crates/ma-harness-plugin-macro", version = "0.1.1" }
ma-harness-core = { path = "../../crates/ma-harness-core", version = "0.1.0" }
# 外部
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "process", "time", "io-util"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
