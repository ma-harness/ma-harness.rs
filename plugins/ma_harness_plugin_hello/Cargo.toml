[package]
name = "ma-harness-plugin-hello"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "ma-harness hello-world demo plugin (用 ma_harness_seam 公开 API)"

[lints]
workspace = true

[dependencies]
# 用公开 seam API, 不直接用 cordis (内部)
ma-harness-seam = { path = "../../crates/ma_harness_seam" }
ma-harness-cordis = { path = "../../crates/ma_harness_cordis" }
ma-harness-plugin-macro = { path = "../../crates/ma_harness_plugin_macro" }
anyhow = { workspace = true }
# Phase 2.2 (T2.2): inventory 分布式注册
inventory = { workspace = true }
# Phase 2.4 (T2.4): AsyncDisposable demo (非 test 也用 tokio::time::sleep)
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
# Phase 2.4 (T2.4): async disposable test
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
